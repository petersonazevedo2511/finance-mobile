<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#101617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finance Mobile</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080c0d;
  color:#f4f1e8;
  font-family:Arial, sans-serif;
}

.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  padding:20px 16px 90px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  font-size:18px;
  font-weight:800;
  letter-spacing:2px;
  color:#f3b45b;
}

.date{
  font-size:12px;
  color:#7f8c8c;
}

.balance{
  background:linear-gradient(145deg,#182526,#0d1112);
  border:1px solid #304345;
  border-radius:18px;
  padding:22px;
  margin-bottom:14px;
  box-shadow:0 15px 35px #0008;
}

.label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:#8f9b9b;
}

.balance-value{
  font-size:34px;
  font-weight:800;
  margin-top:8px;
  color:#f4e7c4;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.card{
  background:#111718;
  border:1px solid #293839;
  border-radius:14px;
  padding:16px;
}

.card-value{
  font-size:19px;
  font-weight:700;
  margin-top:7px;
}

.income{
  color:#9cc7c8;
}

.expense{
  color:#e88983;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:22px;
}

.action{
  border:1px solid #385456;
  border-radius:14px;
  padding:15px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.action.in{
  background:#1b2c2d;
  color:#a9d1d1;
}

.action.out{
  background:#281817;
  color:#e89b95;
}

.section{
  background:#111718;
  border:1px solid #293839;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
}

.section-title{
  font-size:12px;
  color:#d8c18d;
  letter-spacing:1px;
  margin-bottom:15px;
}

.category{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #202b2c;
  font-size:14px;
}

.category:last-child{
  border-bottom:0;
}

.transaction{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #202b2c;
}

.transaction:last-child{
  border-bottom:0;
}

.transaction-name{
  font-weight:600;
}

.transaction-cat{
  font-size:11px;
  color:#748181;
  margin-top:4px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  align-items:flex-end;
  justify-content:center;
  z-index:10;
}

.modal-box{
  width:100%;
  max-width:480px;
  background:#111718;
  border:1px solid #304345;
  border-radius:22px 22px 0 0;
  padding:22px;
}

.modal-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:18px;
}

input,select{
  width:100%;
  padding:14px;
  margin-bottom:11px;
  background:#0a1011;
  color:#f4f1e8;
  border:1px solid #344849;
  border-radius:10px;
  outline:none;
}

.save{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#2E4E4F;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.cancel{
  width:100%;
  padding:12px;
  margin-top:8px;
  background:none;
  border:0;
  color:#8d9999;
  cursor:pointer;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  padding:12px 18px;
  background:#0d1213ee;
  border-top:1px solid #293839;
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:space-around;
}

.bottom button{
  background:none;
  border:0;
  color:#8d9999;
  font-size:11px;
  cursor:pointer;
}

.bottom button:first-child{
  color:#f3b45b;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">FINANCE</div>
    <div class="date" id="today"></div>
  </div>

  <div class="balance">
    <div class="label">Saldo disponível</div>
    <div class="balance-value" id="balance">R$ 0,00</div>
  </div>

  <div class="summary">

    <div class="card">
      <div class="label">Receitas</div>
      <div class="card-value income" id="income">
        R$ 0,00
      </div>
    </div>

    <div class="card">
      <div class="label">Despesas</div>
      <div class="card-value expense" id="expense">
        R$ 0,00
      </div>
    </div>

  </div>

  <div class="actions">

    <button class="action in" onclick="openModal('income')">
      + Receita
    </button>

    <button class="action out" onclick="openModal('expense')">
      − Gasto
    </button>

  </div>

  <div class="section">

    <div class="section-title">
      GASTOS POR CATEGORIA
    </div>

    <div id="categories">
      <div class="category">
        <span>Nenhum gasto registrado</span>
        <span>R$ 0,00</span>
      </div>
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      ÚLTIMOS LANÇAMENTOS
    </div>

    <div id="transactions">
      <div class="transaction">
        <div>
          <div class="transaction-name">
            Nenhum lançamento
          </div>
        </div>
      </div>
    </div>

  </div>

</div>

<div class="bottom">

  <button>⌂<br>Início</button>
  <button onclick="openModal('income')">＋<br>Receita</button>
  <button onclick="openModal('expense')">−<br>Gasto</button>
  <button onclick="openSummary()">◉<br>Resumo</button>

</div>

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-title" id="modalTitle">
      Nova movimentação
    </div>

    <input
      id="description"
      placeholder="Descrição"
    >

    <input
      id="value"
      type="number"
      step="0.01"
      placeholder="Valor"
    >

    <select id="category">

      <option value="Alimentação">
        Alimentação
      </option>

      <option value="Transporte">
        Transporte
      </option>

      <option value="Casa">
        Casa
      </option>

      <option value="Saúde">
        Saúde
      </option>

      <option value="Lazer">
        Lazer
      </option>

      <option value="Outros">
        Outros
      </option>

    </select>

    <button class="save" onclick="saveTransaction()">
      Salvar
    </button>

    <button class="cancel" onclick="closeModal()">
      Cancelar
    </button>

  </div>

</div>
  <div id="summaryScreen" style="
  display:none;
  position:fixed;
  inset:0;
  z-index:9000;
  background:#101617;
  color:white;
  padding:24px;
  box-sizing:border-box;
  overflow-y:auto;
">

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
  ">

    <div>
      <div style="
        color:#d6b36a;
        font-size:13px;
        letter-spacing:2px;
      ">
        FINANCE
      </div>

      <h2 style="margin:6px 0 0;">
        Resumo financeiro
      </h2>
    </div>

    <button
      onclick="closeSummary()"
      style="
        background:#182224;
        color:white;
        border:0;
        border-radius:10px;
        padding:10px 14px;
        font-size:18px;
      "
    >
      ×
    </button>

  </div>

  <div style="
    background:#182224;
    border-radius:18px;
    padding:22px;
    margin-bottom:14px;
  ">

    <div style="
      color:#999;
      font-size:13px;
      margin-bottom:8px;
    ">
      Saldo atual
    </div>

    <div
      id="summaryBalance"
      style="
        font-size:30px;
        font-weight:bold;
        color:#d6b36a;
      "
    >
      R$ 0,00
    </div>

  </div>

  <div style="
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:24px;
  ">

    <div style="
      background:#182224;
      border-radius:16px;
      padding:18px;
    ">

      <div style="color:#999;font-size:13px;">
        Receitas
      </div>

      <div
        id="summaryIncome"
        style="
          margin-top:8px;
          font-size:20px;
          font-weight:bold;
        "
      >
        R$ 0,00
      </div>

    </div>

    <div style="
      background:#182224;
      border-radius:16px;
      padding:18px;
    ">

      <div style="color:#999;font-size:13px;">
        Gastos
      </div>

      <div
        id="summaryExpense"
        style="
          margin-top:8px;
          font-size:20px;
          font-weight:bold;
        "
      >
        R$ 0,00
      </div>

    </div>

  </div>

  <h3 style="margin-bottom:12px;">
    Gastos por categoria
  </h3>

  <div id="summaryCategories"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  'https://soutyvbddqzjbjkkodqx.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_eLU2Qbz-Cva6mMI8EA4arQ_fi_TyPnR';

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let financeData = {
  moves: [],
  accounts: [],
  cards: [],
  assets: [],
  liabilities: [],
  goals: [],
  budgets: [],
  recurring: []
};

let currentType = 'expense';

const money = value =>
  Number(value || 0).toLocaleString(
    'pt-BR',
    {
      style:'currency',
      currency:'BRL'
    }
  );

function openModal(type){

  currentType = type;

  document.getElementById('modalTitle').textContent =
    type === 'income'
      ? 'Nova receita'
      : 'Novo gasto';

  document.getElementById('modal').style.display =
    'flex';
}

function closeModal(){

  document.getElementById('modal').style.display =
    'none';
}

function mobileTransactions(){

  return (financeData.moves || [])
    .map(m => ({
      id:m.id,
      type:m.type === 'income'
        ? 'income'
        : 'expense',
      description:m.desc || '',
      value:Number(m.value || 0),
      category:m.cat || 'Outros',
      date:m.date || ''
    }));
}

async function loadFinance(){

  const {
    data:{user},
    error:userError
  } =
    await supabaseClient.auth.getUser();

  if(userError || !user){
    return;
  }

  const {
    data:row,
    error
  } =
    await supabaseClient
      .from('finance_data')
      .select('data')
      .eq('user_id',user.id)
      .maybeSingle();

  if(error){

    console.error(error);

    alert(
      'Não foi possível carregar seus dados financeiros.'
    );

    return;
  }

  if(row && row.data){

    financeData = {
      ...financeData,
      ...row.data
    };

    if(!Array.isArray(financeData.moves))
      financeData.moves=[];

    localStorage.setItem(
      'financeMobileCloud',
      JSON.stringify(financeData)
    );

  }else{

    await saveFinance();

  }

  render();
}

async function saveFinance(){

  const {
    data:{user},
    error:userError
  } =
    await supabaseClient.auth.getUser();

  if(userError || !user){

    console.error(
      'Usuário não autenticado.'
    );

    return false;
  }

  localStorage.setItem(
    'financeMobileCloud',
    JSON.stringify(financeData)
  );

  const {
    error
  } =
    await supabaseClient
      .from('finance_data')
      .upsert({
        id:'00000000-0000-0000-0000-000000000001',
        user_id:user.id,
        data:financeData
      });

  if(error){

    console.error(
      'Erro ao salvar:',
      error
    );

    alert(
      'Não foi possível salvar seus dados.'
    );

    return false;
  }

  return true;
}

async function saveTransaction(){

  const description =
    document.getElementById('description')
      .value
      .trim();

  const value =
    Number(
      document.getElementById('value').value
    );

  const category =
    document.getElementById('category').value;

  if(!description || value <= 0){

    alert(
      'Informe a descrição e um valor válido.'
    );

    return;
  }

  if(!Array.isArray(financeData.moves))
    financeData.moves=[];

  financeData.moves.push({

    id:
      'id-' +
      Date.now() +
      '-' +
      Math.random()
        .toString(36)
        .slice(2,8),

    type:
      currentType === 'income'
        ? 'income'
        : 'expense',

    desc:description,

    value:value,

    cat:category,

    date:
      new Date()
        .toISOString()
        .slice(0,10),

    accountId:'',

    status:'paid'

  });

  const saved =
    await saveFinance();

  if(!saved)
    return;

  document.getElementById(
    'description'
  ).value='';

  document.getElementById(
    'value'
  ).value='';

  closeModal();

  render();
}

function render(){

  const transactions =
    mobileTransactions();

  let income=0;
  let expense=0;

  transactions.forEach(t=>{

    if(t.type === 'income')
      income += Number(t.value);

    else
      expense += Number(t.value);

  });

  document.getElementById(
    'income'
  ).textContent =
    money(income);

  document.getElementById(
    'expense'
  ).textContent =
    money(expense);

  document.getElementById(
    'balance'
  ).textContent =
    money(income-expense);

  renderCategories();

  renderTransactions();
}

function renderCategories(){

  const box =
    document.getElementById(
      'categories'
    );

  const categories={};

  mobileTransactions()
    .filter(
      t=>t.type==='expense'
    )
    .forEach(t=>{

      categories[t.category] =
        (categories[t.category] || 0)
        + Number(t.value);

    });

  const entries =
    Object.entries(categories);

  if(!entries.length){

    box.innerHTML=`
      <div class="category">
        <span>Nenhum gasto registrado</span>
        <span>R$ 0,00</span>
      </div>
    `;

    return;
  }

  box.innerHTML =
    entries
      .sort(
        (a,b)=>b[1]-a[1]
      )
      .map(
        ([cat,value])=>`

          <div class="category">

            <span>${cat}</span>

            <strong>
              ${money(value)}
            </strong>

          </div>

        `
      )
      .join('');
}

function renderTransactions(){

  const box =
    document.getElementById('transactions');

  const list =
    mobileTransactions();

  if(!list.length){

    box.innerHTML=`
      <div class="transaction">
        <div>
          <div class="transaction-name">
            Nenhum lançamento
          </div>
        </div>
      </div>
    `;

    return;
  }

  box.innerHTML =
    [...list]
      .reverse()
      .slice(0,10)
      .map(t=>`

        <div
          class="transaction"
          onclick="editTransaction('${t.id}')"
          style="cursor:pointer"
        >

          <div>

            <div class="transaction-name">
              ${t.description}
            </div>

            <div class="transaction-cat">
              ${t.category}
            </div>

          </div>

          <strong class="${
            t.type === 'income'
              ? 'income'
              : 'expense'
          }">

            ${
              t.type === 'income'
                ? '+ '
                : '- '
            }

            ${money(t.value)}

          </strong>

        </div>

      `)
      .join('');
}
  async function editTransaction(id){

  const move =
    financeData.moves.find(
      m => m.id === id
    );

  if(!move){

    alert('Lançamento não encontrado.');

    return;
  }

  const description =
    prompt(
      'Descrição:',
      move.desc || move.description || ''
    );

  if(description === null) return;

  const value =
    prompt(
      'Valor:',
      move.value
    );

  if(value === null) return;

  const category =
    prompt(
      'Categoria:',
      move.cat || move.category || 'Outros'
    );

  if(category === null) return;

  move.desc = description.trim();
  move.value = Number(value);
  move.cat = category.trim();

  await saveFinance();

  render();

}
function showApp(){

  document.getElementById(
    'authScreen'
  ).style.display='none';

  document.querySelector(
    '.app'
  ).style.display='block';

  document.querySelector(
    '.bottom'
  ).style.display='flex';

  loadFinance();
}

function showLogin(){

  document.querySelector(
    '.app'
  ).style.display='none';

  document.querySelector(
    '.bottom'
  ).style.display='none';

  document.getElementById(
    'authScreen'
  ).style.display='flex';
}

function createLogin(){

  const screen =
    document.createElement('div');

  screen.id='authScreen';

  screen.style.cssText=`
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#080c0d;
  `;

  screen.innerHTML=`

    <div style="
      width:100%;
      max-width:380px;
      padding:30px;
      border:1px solid #304345;
      border-radius:20px;
      background:#111718;
      box-shadow:0 20px 60px #000b;
    ">

      <div style="
        text-align:center;
        color:#f3b45b;
        font-size:22px;
        font-weight:800;
        letter-spacing:2px;
        margin-bottom:8px;
      ">
        FINANCE
      </div>

      <div style="
        text-align:center;
        color:#8d9999;
        font-size:13px;
        margin-bottom:25px;
      ">
        Entre na sua conta
      </div>

      <input
        id="loginEmail"
        type="email"
        placeholder="E-mail"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Senha"
      >

      <button
        id="loginButton"
        class="save"
      >
        Entrar
      </button>

      <div
        id="loginMessage"
        style="
          text-align:center;
          color:#f3b45b;
          font-size:12px;
          margin-top:14px;
          min-height:18px;
        "
      ></div>

    </div>
  `;

  document.body.appendChild(screen);

  document.getElementById(
    'loginButton'
  ).onclick=async()=>{

    const email =
      document.getElementById(
        'loginEmail'
      ).value.trim();

    const password =
      document.getElementById(
        'loginPassword'
      ).value;

    const message =
      document.getElementById(
        'loginMessage'
      );

    if(!email || !password){

      message.textContent =
        'Digite seu e-mail e sua senha.';

      return;
    }

    message.textContent =
      'Entrando...';

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });

    if(error){

      message.textContent =
        'E-mail ou senha incorretos.';

      console.error(error);

      return;
    }

    if(data.session){

      showApp();

    }
  };
}

document.getElementById(
  'today'
).textContent =
  new Date().toLocaleDateString(
    'pt-BR'
  );

createLogin();

supabaseClient.auth
  .getSession()
  .then(({data})=>{

    if(data.session)
      showApp();

    else
      showLogin();

  });
  function openSummary(){

  let income = 0;
  let expense = 0;
  const categories = {};

  financeData.moves.forEach(move => {

    const value = Number(move.value || 0);

    if(move.type === 'income'){

      income += value;

    }else{

      expense += value;

      const category = move.cat || 'Outros';

      categories[category] =
        (categories[category] || 0) + value;

    }

  });

  document.getElementById('summaryIncome').textContent =
    money(income);

  document.getElementById('summaryExpense').textContent =
    money(expense);

  document.getElementById('summaryBalance').textContent =
    money(income - expense);

  const categoryBox =
    document.getElementById('summaryCategories');

  const entries =
    Object.entries(categories)
      .sort((a,b) => b[1] - a[1]);

  if(!entries.length){

    categoryBox.innerHTML = `
      <div style="
        background:#182224;
        padding:18px;
        border-radius:14px;
        color:#999;
      ">
        Nenhum gasto registrado.
      </div>
    `;

  }else{

    categoryBox.innerHTML =
      entries.map(([category,value]) => `

        <div style="
          display:flex;
          justify-content:space-between;
          background:#182224;
          padding:17px;
          border-radius:14px;
          margin-bottom:8px;
        ">

          <span>${category}</span>

          <strong>${money(value)}</strong>

        </div>

      `).join('');

  }

  document.getElementById('summaryScreen').style.display =
    'block';

}


function closeSummary(){

  document.getElementById('summaryScreen').style.display =
    'none';

}

</script>

</body>
</html>
